name: prepublish-storybook

on:
  push:
    paths:
      - 'src/**'
    branches:
      - main

jobs:
  console-event:
    runs-on: ubuntu-latest
    steps:
      - name: comment PR
        uses: tsickert/discord-webhook@v5.3.0
        env:
          ENV: 'envenv'
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          content: 'push: ${{ github.event.push.commits[0].message }}'
